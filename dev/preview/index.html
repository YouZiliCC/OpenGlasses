<!doctype html>
<!-- Theme preview (DESIGN §10.8): pnpm dev, then http://localhost:1420/dev/preview/ . See README.md. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenGlasses theme preview</title>
    <link rel="icon" href="data:," />
    <style>
      /* The lens/panel frames are dark (base CSS); an embedder with another color-scheme would
         give the transparent frames an opaque canvas. */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #15171c;
        color: #d4d7dd;
        font: 13px system-ui, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        padding: 8px 14px;
        background: #1e2128;
        border-bottom: 1px solid #2c3039;
      }
      header b {
        letter-spacing: 0.04em;
      }
      header select,
      header button {
        font: inherit;
        color: inherit;
        background: #2a2e37;
        border: 1px solid #3b404b;
        border-radius: 4px;
        padding: 3px 8px;
      }
      header button {
        cursor: pointer;
        padding: 3px 14px;
      }
      /* One line, so the monitor never moves (shoot.mjs screenshots it). */
      #status {
        flex: 1 1 0;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #8a909c;
      }
      #stage {
        flex: 1;
        min-height: 0;
        display: grid;
        place-items: start center;
        overflow: hidden;
      }
      #monitor {
        position: relative;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        transform-origin: 0 0;
        background: #000 url("assets/desktop.png");
      }
      #monitor iframe {
        position: absolute;
        border: 0;
        background: transparent;
      }
      #lens {
        left: 0;
        top: 0;
        width: 1600px;
        height: 900px;
        z-index: 2;
        pointer-events: none;
      }
      #panel {
        z-index: 3;
        visibility: hidden;
      }
      /* decorations(false) + shadow(true): Win11 keeps the rounded corners and the shadow. */
      #settings {
        z-index: 1;
        left: 390px;
        top: 126px;
        width: 820px;
        height: 600px;
        border-radius: 8px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <b>OpenGlasses theme preview</b>
      <label>Theme <select id="theme"></select></label>
      <label>
        Speed
        <select id="speed">
          <option value="fast">Fast</option>
          <option value="normal">Normal</option>
          <option value="slow">Slow</option>
        </select>
      </label>
      <label>Scenario <select id="scenario"></select></label>
      <button id="play">▶ Play</button>
      <span id="status">loading…</span>
    </header>
    <div id="stage">
      <div id="fit">
        <div id="monitor">
          <iframe id="settings" name="settings" title="settings"></iframe>
          <iframe id="lens" name="lens" title="lens"></iframe>
          <iframe id="panel" name="panel" title="panel"></iframe>
        </div>
      </div>
    </div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
